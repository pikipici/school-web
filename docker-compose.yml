name: informatika-monitoring-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-monitoring_local_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-dev-only-admin-change-me}
      POSTGRES_DB: postgres
      APP_USER: ${POSTGRES_APP_USER:-monitoring_app}
      APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-dev-only-app-change-me}
      APP_DB: ${POSTGRES_DB:-informatika_monitoring}
    ports:
      # Deliberately avoids PostgreSQL's usual host port and the app's :8300 runtime.
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d postgres
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres-bootstrap:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_ADMIN_USER:-monitoring_local_admin}
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:-dev-only-admin-change-me}
      PGDATABASE: postgres
      APP_USER: ${POSTGRES_APP_USER:-monitoring_app}
      APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-dev-only-app-change-me}
      APP_DB: ${POSTGRES_DB:-informatika_monitoring}
    command:
      - /bin/sh
      - -eu
      - -c
      - |
        psql -v ON_ERROR_STOP=1 \
          --set=app_user="$${APP_USER}" \
          --set=app_password="$${APP_PASSWORD}" \
          --set=app_db="$${APP_DB}" <<'SQL'
        SELECT format(
          'CREATE ROLE %I LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION',
          :'app_user', :'app_password'
        ) WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'app_user') \gexec
        SELECT format(
          'CREATE DATABASE %I OWNER %I', :'app_db', :'app_user'
        ) WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'app_db') \gexec
        SELECT format('REVOKE ALL ON DATABASE %I FROM PUBLIC', :'app_db') \gexec
        SELECT format('GRANT CONNECT, TEMPORARY ON DATABASE %I TO %I', :'app_db', :'app_user') \gexec
        SQL

volumes:
  postgres-dev-data:
    name: informatika-monitoring-postgres-dev
