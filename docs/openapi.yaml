openapi: 3.0.3
info:
  title: Informatika Monitoring API
  version: 0.6.0
  description: Kontrak API yang saat ini diimplementasikan oleh backend Go, termasuk autentikasi admin. Endpoint admin hanya aktif bila database dikonfigurasi.
servers:
  - url: /
    description: Same-origin runtime
paths:
  /healthz:
    get:
      summary: Periksa liveness proses
      operationId: getHealth
      responses:
        "200":
          description: Proses HTTP berjalan.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
  /readyz:
    get:
      summary: Periksa kesiapan database
      operationId: getReadiness
      responses:
        "200":
          description: Database siap digunakan.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                status: ok
                database: ok
        "503":
          description: Database belum dikonfigurasi atau tidak tersedia.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                status: unavailable
                database: unavailable
  /api/v1/public/summary:
    get:
      summary: Ambil ringkasan monitoring publik
      operationId: getPublicSummary
      responses:
        "200":
          description: Ringkasan publik berhasil dibaca.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSummaryEnvelope"
              example:
                data:
                  totalGroups: 0
                  manualUpdate: true
                  updatedAt: null
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/auth/login:
    post:
      summary: Masuk sebagai admin
      description: >
        Membuat sesi dan men-set cookie HttpOnly SameSite=Strict (bernama `admin_session`,
        atau `__Host-admin_session` dengan atribut Secure di HTTPS). Cookie berlaku
        selama sesi browser; server menolak sesi yang tidak aktif 30 menit atau lebih dari 12 jam.
        Header Origin, bila ada, wajib sama dengan host. Kegagalan login tidak
        membedakan nama pengguna yang salah dari kata sandi yang salah.
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Berhasil masuk.
          headers:
            Set-Cookie:
              description: Cookie sesi admin.
              schema:
                type: string
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: Nama pengguna atau kata sandi salah (INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Origin tidak diizinkan (FORBIDDEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Badan permintaan lebih dari 4 KiB (PAYLOAD_TOO_LARGE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Content-Type bukan application/json (UNSUPPORTED_MEDIA_TYPE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Terlalu banyak percobaan (RATE_LIMITED).
          headers:
            Retry-After:
              description: Detik sampai boleh mencoba lagi.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Kapasitas hash sandi penuh (SERVICE_BUSY).
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/admin/auth/logout:
    post:
      summary: Keluar dari sesi admin
      description: >
        Idempoten. Bila sesi valid, wajib menyertakan header X-CSRF-Token yang
        sama dengan token dari login atau /me, dan Origin yang sama dengan host.
      operationId: adminLogout
      parameters:
        - name: X-CSRF-Token
          in: header
          required: false
          schema:
            type: string
      responses:
        "204":
          description: Sesi dihapus dan cookie dibersihkan.
        "403":
          description: CSRF token atau Origin tidak valid (FORBIDDEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/admin/auth/me:
    get:
      summary: Ambil identitas sesi admin
      operationId: adminMe
      responses:
        "200":
          description: Sesi valid.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401":
          description: Belum masuk atau sesi berakhir (UNAUTHENTICATED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/public/announcements:
    get:
      summary: Daftar pengumuman terbit
      description: Hanya status published. Yang disematkan lebih dulu, lalu terbaru.
      operationId: listPublicAnnouncements
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Satu halaman pengumuman.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicAnnouncement"
                  meta:
                    $ref: "#/components/schemas/PageMeta"
        "400":
          $ref: "#/components/responses/BadQuery"
  /api/v1/public/announcements/{id}:
    get:
      summary: Satu pengumuman terbit
      operationId: getPublicAnnouncement
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Pengumuman ditemukan.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PublicAnnouncement"
        "404":
          description: Tidak ada, belum terbit, atau sudah dihapus (draf tidak pernah dibedakan dari tidak ada).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/public/topics:
    get:
      summary: Tujuh topik proyek K1-K7
      operationId: listPublicTopics
      responses:
        "200":
          description: Semua topik, urut sortOrder.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Topic"
  /api/v1/public/materials:
    get:
      summary: Daftar materi terbit
      operationId: listPublicMaterials
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: topic
          in: query
          required: false
          description: Kode topik, mis. K1. Kosong berarti semua topik termasuk Umum.
          schema:
            type: string
      responses:
        "200":
          description: Satu halaman materi.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicMaterial"
                  meta:
                    $ref: "#/components/schemas/PageMeta"
        "400":
          $ref: "#/components/responses/BadQuery"
  /api/v1/public/materials/{id}:
    get:
      summary: Satu materi terbit
      operationId: getPublicMaterial
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Materi ditemukan.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PublicMaterial"
        "404":
          description: Tidak ada, belum terbit, atau sudah dihapus.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/public/materials/{id}/attachments:
    description: Hanya aktif bila ATTACHMENTS_DIR dikonfigurasi.
    get:
      summary: Daftar lampiran satu materi terbit (lama ke baru)
      operationId: listPublicAttachments
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Lampiran materi.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicAttachment"
        "404":
          description: Materi tidak ada atau belum terbit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/public/attachments/{id}:
    description: Hanya aktif bila ATTACHMENTS_DIR dikonfigurasi.
    get:
      summary: Unduh lampiran dari materi terbit
      description: >
        Selalu sebagai unduhan (Content-Disposition attachment dengan nama ASCII cadangan dan filename* UTF-8),
        X-Content-Type-Options nosniff, Content-Security-Policy "default-src 'none'; sandbox",
        Cache-Control no-cache, dan ETag berupa SHA-256 berkas. Mendukung Range, If-Range, dan If-None-Match.
        Tenggat tulis untuk rute ini 10 menit.
      operationId: downloadPublicAttachment
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Seluruh berkas.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.ms-powerpoint:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema:
                type: string
                format: binary
        "206":
          description: Sebagian berkas sesuai Range.
        "304":
          description: ETag cocok dengan If-None-Match.
        "404":
          description: Lampiran tidak ada, materinya belum terbit, atau berkasnya hilang dari disk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "416":
          description: Range di luar ukuran berkas.
  /api/v1/public/progress:
    description: Hanya aktif bila database dikonfigurasi.
    get:
      summary: Tabel progres publik (tahun ajaran aktif, kelas dan kelompok aktif)
      operationId: getPublicProgress
      parameters:
        - {name: class, in: query, required: false, schema: {type: string, maxLength: 20}, description: Kode kelas, tanpa beda huruf besar/kecil}
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 60}, description: Cari nama kelompok (teks biasa)}
        - {name: status, in: query, required: false, schema: {type: string, enum: [BELUM, SEBAGIAN, LENGKAP, TUNTAS]}}
      responses:
        "200":
          description: Cache-Control no-cache.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PublicProgress"
        "400":
          $ref: "#/components/responses/BadQuery"
  /api/v1/admin/academic-years:
    get:
      summary: Semua tahun ajaran (terbaru dulu)
      operationId: listAcademicYears
      responses:
        "200":
          description: Daftar tahun ajaran.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/AcademicYear"}}
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      summary: Tambah tahun ajaran (tidak aktif)
      operationId: createAcademicYear
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [label]
              properties:
                label: {type: string, example: 2027/2028}
      responses:
        "201":
          description: Dibuat; audit progress.year_created.
          content:
            application/json:
              schema: {type: object, properties: {data: {$ref: "#/components/schemas/AcademicYear"}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/ProgressConflict"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/admin/academic-years/{id}/activate:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Jadikan satu-satunya tahun ajaran aktif
      operationId: activateAcademicYear
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204": {description: Diaktifkan; audit progress.year_activated.}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/admin/classes:
    get:
      summary: Kelas satu tahun ajaran (bawaan tahun aktif)
      operationId: listClasses
      parameters:
        - {name: year, in: query, required: false, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        "200":
          description: Daftar kelas dengan jumlah kelompok.
          content:
            application/json:
              schema: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/Class"}}}}
        "400": {$ref: "#/components/responses/BadQuery"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    post:
      summary: Tambah kelas
      operationId: createClass
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClassWrite"}
      responses:
        "201":
          description: Dibuat; audit progress.class_created.
          content:
            application/json:
              schema: {type: object, properties: {data: {$ref: "#/components/schemas/Class"}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/ProgressConflict"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/admin/classes/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Satu kelas
      operationId: getClass
      responses:
        "200":
          description: Kelas.
          content:
            application/json:
              schema: {type: object, properties: {data: {$ref: "#/components/schemas/Class"}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      summary: Ubah atau nonaktifkan kelas (wajib active dan updatedAt)
      operationId: updateClass
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClassWrite"}
      responses:
        "200":
          description: Diubah; audit progress.class_updated.
          content:
            application/json:
              schema: {type: object, properties: {data: {$ref: "#/components/schemas/Class"}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/ProgressConflict"}
        "422": {$ref: "#/components/responses/Invalid"}
    delete:
      summary: Hapus kelas tanpa kelompok
      operationId: deleteClass
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204": {description: Dihapus; audit progress.class_deleted.}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/ProgressConflict"}
  /api/v1/admin/groups:
    get:
      summary: Kelompok satu kelas (urut sortOrder lalu nama)
      operationId: listGroups
      parameters:
        - {name: class, in: query, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        "200":
          description: Daftar kelompok.
          content:
            application/json:
              schema: {type: object, properties: {data: {type: array, items: {$ref: "#/components/schemas/Group"}}}}
        "400": {$ref: "#/components/responses/BadQuery"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    post:
      summary: Tambah kelompok
      operationId: createGroup
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GroupWrite"}
      responses:
        "201":
          description: Dibuat; audit progress.group_created (tanpa email).
          content:
            application/json:
              schema: {type: object, properties: {data: {$ref: "#/components/schemas/Group"}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/ProgressConflict"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/admin/groups/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Satu kelompok
      operationId: getGroup
      responses:
        "200":
          description: Kelompok.
          content:
            application/json:
              schema: {type: object, properties: {data: {$ref: "#/components/schemas/Group"}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      summary: Ubah, pindah kelas, atau nonaktifkan kelompok (wajib active dan updatedAt)
      operationId: updateGroup
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GroupWrite"}
      responses:
        "200":
          description: Diubah; audit progress.group_updated.
          content:
            application/json:
              schema: {type: object, properties: {data: {$ref: "#/components/schemas/Group"}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/ProgressConflict"}
        "422": {$ref: "#/components/responses/Invalid"}
    delete:
      summary: Hapus kelompok (ditolak bila sudah punya catatan)
      operationId: deleteGroup
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204": {description: Dihapus; audit progress.group_deleted.}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/ProgressConflict"}
  /api/v1/admin/groups/{id}/submissions:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Putaran pengumpulan satu kelompok + status pengumpulan terhitung
      operationId: listSubmissionRounds
      responses:
        "200":
          description: Status BELUM/SEBAGIAN/LENGKAP dihitung dari semua putaran.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [submission, rounds]
                    properties:
                      submission: {type: string, enum: [BELUM, SEBAGIAN, LENGKAP]}
                      rounds: {type: array, items: {$ref: "#/components/schemas/SubmissionRound"}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      summary: Catat putaran berikutnya (setelah guru memeriksa Gmail sendiri)
      description: roundNumber wajib nomor berikutnya (0 untuk yang pertama). Nomor yang sama dua kali (klik ganda) atau nomor lompat memberi 409 CONFLICT. Perubahan dan audit progress.round_recorded satu transaksi.
      operationId: recordSubmissionRound
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubmissionRoundWrite"}
      responses:
        "201":
          description: Dicatat.
          content:
            application/json:
              schema: {type: object, properties: {data: {$ref: "#/components/schemas/SubmissionRound"}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/ProgressConflict"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/admin/submissions/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      summary: Koreksi putaran (wajib updatedAt)
      operationId: updateSubmissionRound
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubmissionRoundWrite"}
      responses:
        "200":
          description: Disimpan; audit progress.round_updated.
          content:
            application/json:
              schema: {type: object, properties: {data: {$ref: "#/components/schemas/SubmissionRound"}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/ProgressConflict"}
        "422": {$ref: "#/components/responses/Invalid"}
    delete:
      summary: Hapus putaran terakhir (salah input)
      operationId: deleteSubmissionRound
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204": {description: Dihapus; audit progress.round_deleted.}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: "NOT_LAST_ROUND: hanya putaran terakhir yang bisa dihapus.", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
  /api/v1/admin/groups/{id}/notebook:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Status buku tulis kelompok
      operationId: getGroupNotebook
      responses:
        "200":
          description: Belum pernah dicatat = received false.
          content:
            application/json:
              schema: {type: object, properties: {data: {$ref: "#/components/schemas/GroupNotebook"}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      summary: Catat buku tulis diterima atau belum
      operationId: putGroupNotebook
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [received]
              properties:
                received: {type: boolean}
                receivedAt: {type: string, format: date-time, nullable: true, description: Kosong saat received = sekarang.}
                note: {type: string, maxLength: 1000}
      responses:
        "200":
          description: Disimpan; audit progress.notebook_updated.
          content:
            application/json:
              schema: {type: object, properties: {data: {$ref: "#/components/schemas/GroupNotebook"}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /api/v1/admin/announcements:
    get:
      summary: Semua pengumuman (draf dan terbit)
      operationId: listAdminAnnouncements
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/AdminList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      summary: Buat pengumuman
      operationId: createAdminAnnouncement
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementWrite"
      responses:
        "201":
          $ref: "#/components/responses/AdminItemCreated"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/v1/admin/announcements/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Satu pengumuman (draf atau terbit)
      operationId: getAdminAnnouncement
      responses:
        "200":
          $ref: "#/components/responses/AdminItemOK"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Ubah pengumuman
      description: Kirim ulang semua isian beserta updatedAt yang terakhir dibaca. updatedAt lama ditolak 409.
      operationId: updateAdminAnnouncement
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AnnouncementWrite"
                - $ref: "#/components/schemas/UpdatedAtGuard"
      responses:
        "200":
          $ref: "#/components/responses/AdminItemOK"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      summary: Hapus permanen pengumuman
      operationId: deleteAdminAnnouncement
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204":
          description: Dihapus; judul dan id tercatat di audit_log.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/materials:
    get:
      summary: Semua materi (draf dan terbit)
      operationId: listAdminMaterials
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/AdminList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      summary: Buat materi
      operationId: createAdminMaterial
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialWrite"
      responses:
        "201":
          $ref: "#/components/responses/AdminItemCreated"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/v1/admin/materials/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Satu materi (draf atau terbit)
      operationId: getAdminMaterial
      responses:
        "200":
          $ref: "#/components/responses/AdminItemOK"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Ubah materi
      operationId: updateAdminMaterial
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/MaterialWrite"
                - $ref: "#/components/schemas/UpdatedAtGuard"
      responses:
        "200":
          $ref: "#/components/responses/AdminItemOK"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      summary: Hapus permanen materi
      operationId: deleteAdminMaterial
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204":
          description: Dihapus; judul dan id tercatat di audit_log. Bila lampiran aktif, berkas lampirannya ikut dihapus dari disk.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/materials/{id}/attachments:
    description: Hanya aktif bila ATTACHMENTS_DIR dikonfigurasi.
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Daftar lampiran satu materi (lama ke baru)
      operationId: listAdminAttachments
      responses:
        "200":
          description: Lampiran materi.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Attachment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Unggah satu lampiran PDF/PPT/PPTX
      description: >
        Jenis ditentukan dari isi berkas dan ekstensi harus cocok; presentasi bermakro ditolak.
        Maks 25 MiB per berkas, 5 per materi, kuota total 2 GiB, dan sisa disk minimal 1 GiB.
        Hanya satu unggahan berjalan pada satu waktu. Tenggat baca/tulis untuk rute ini 10 menit.
      operationId: uploadAdminAttachment
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Lampiran disimpan; tercatat di audit_log sebagai content.attachment_uploaded.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentEnvelope"
        "400":
          description: Bagian "file" tidak ada, nama berkas tidak dapat dipakai, atau unggahan terputus (INVALID_REQUEST, INVALID_FILE_NAME).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Materi sudah punya 5 lampiran (ATTACHMENT_LIMIT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Berkas lebih dari 25 MiB (PAYLOAD_TOO_LARGE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Bukan multipart (UNSUPPORTED_MEDIA_TYPE), bukan PDF/PPT/PPTX atau ekstensi tidak cocok (UNSUPPORTED_FILE_TYPE), atau bermakro (MACRO_NOT_ALLOWED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Unggahan lain sedang berjalan (SERVICE_BUSY); lihat Retry-After.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "507":
          description: Kuota 2 GiB penuh (STORAGE_QUOTA_EXCEEDED) atau sisa disk kurang (INSUFFICIENT_STORAGE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/admin/attachments/{id}:
    description: Hanya aktif bila ATTACHMENTS_DIR dikonfigurasi.
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      summary: Hapus lampiran (baris lalu berkas)
      operationId: deleteAdminAttachment
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204":
          description: Dihapus; tercatat di audit_log sebagai content.attachment_deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token dari login atau /me. Origin juga wajib sama dengan host.
      schema:
        type: string
  headers:
    RequestID:
      description: ID korelasi unik untuk request.
      schema:
        type: string
  responses:
    BadQuery:
      description: Parameter page/limit tidak valid (VALIDATION_ERROR).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthenticated:
      description: Belum masuk atau sesi berakhir (UNAUTHENTICATED).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: CSRF token atau Origin tidak valid (FORBIDDEN).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: updatedAt tidak sama dengan yang tersimpan; data sudah diubah di tempat lain (CONFLICT).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Invalid:
      description: Judul, isi, status, topik, atau urutan tidak memenuhi aturan (VALIDATION_ERROR); untuk progres juga INVALID_REFERENCE bila tahun ajaran, kelas, atau topik tidak ada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ProgressConflict:
      description: CONFLICT (updatedAt basi), DUPLICATE (kode/nama sudah dipakai, tanpa beda huruf), atau IN_USE (masih punya data terkait; nonaktifkan).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AdminList:
      description: Satu halaman item admin.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data, meta]
            properties:
              data:
                type: array
                items:
                  $ref: "#/components/schemas/AdminItem"
              meta:
                $ref: "#/components/schemas/PageMeta"
    AdminItemOK:
      description: Item admin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminItemEnvelope"
    AdminItemCreated:
      description: Item dibuat.
      headers:
        Location:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminItemEnvelope"
    InvalidRequest:
      description: Permintaan tidak valid (INVALID_REQUEST).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Endpoint tidak ditemukan.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: NOT_FOUND
              message: Endpoint tidak ditemukan.
  schemas:
    PageMeta:
      type: object
      additionalProperties: false
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    PublicAnnouncement:
      type: object
      additionalProperties: false
      required: [id, title, body, publishedAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        body:
          type: string
          description: Teks biasa; klien tidak boleh merendernya sebagai HTML.
        publishedAt:
          type: string
          format: date-time
    Topic:
      type: object
      additionalProperties: false
      required: [id, code, title, sortOrder]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
          pattern: "^K[1-9]$"
        title:
          type: string
        sortOrder:
          type: integer
    PublicMaterial:
      type: object
      additionalProperties: false
      required: [id, title, description, publishedAt, topic]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
          description: Teks biasa.
        publishedAt:
          type: string
          format: date-time
        topic:
          nullable: true
          description: null berarti Umum (tanpa topik).
          type: object
          additionalProperties: false
          required: [id, code, title]
          properties:
            id:
              type: integer
              format: int64
            code:
              type: string
            title:
              type: string
    AnnouncementWrite:
      type: object
      required: [title, status]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
          description: Dipangkas spasinya; 1-160 karakter Unicode.
        body:
          type: string
          maxLength: 10000
          default: ""
        status:
          type: string
          enum: [draft, published]
        pinned:
          type: boolean
          default: false
    MaterialWrite:
      type: object
      required: [title, status]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 20000
          default: ""
        status:
          type: string
          enum: [draft, published]
        topicId:
          type: integer
          format: int64
          nullable: true
          description: null berarti Umum.
        sortOrder:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
    UpdatedAtGuard:
      type: object
      required: [updatedAt]
      properties:
        updatedAt:
          type: string
          format: date-time
          description: Nilai updatedAt persis seperti diterima dari server.
    AdminItem:
      type: object
      description: >
        Field bernilai nol (body/description kosong, pinned false, sortOrder 0,
        topicId kosong) dihilangkan dari respons; klien wajib mengisi nilai bawaannya.
      required: [id, title, status, publishedAt, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        topicId:
          type: integer
          format: int64
        title:
          type: string
        body:
          type: string
          description: Hanya untuk pengumuman.
        description:
          type: string
          description: Hanya untuk materi.
        status:
          type: string
          enum: [draft, published]
        pinned:
          type: boolean
        sortOrder:
          type: integer
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: Diisi saat pertama terbit dan tidak berubah sesudahnya.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AdminItemEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AdminItem"
    Attachment:
      type: object
      additionalProperties: false
      description: Kunci penyimpanan di disk tidak pernah dikirim ke klien.
      required: [id, materialId, name, kind, contentType, size, createdAt]
      properties:
        id:
          type: integer
          format: int64
        materialId:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 200
          description: Nama asli yang sudah dibersihkan (tanpa jalur dan karakter kontrol); hanya teks tampilan.
        kind:
          type: string
          enum: [pdf, ppt, pptx]
        contentType:
          type: string
          enum:
            - application/pdf
            - application/vnd.ms-powerpoint
            - application/vnd.openxmlformats-officedocument.presentationml.presentation
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 26214400
        createdAt:
          type: string
          format: date-time
    AttachmentEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Attachment"
    PublicAttachment:
      type: object
      additionalProperties: false
      description: Hanya yang perlu pengunjung; tanpa kunci penyimpanan, hash, atau waktu.
      required: [id, name, kind, size]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 200
        kind:
          type: string
          enum: [pdf, ppt, pptx]
        size:
          type: integer
          format: int64
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 128
          format: password
    AuthEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [username, csrfToken, expiresAt]
          properties:
            username:
              type: string
            csrfToken:
              type: string
              description: Kirim sebagai header X-CSRF-Token pada setiap permintaan POST/PUT/PATCH/DELETE admin.
            expiresAt:
              type: string
              format: date-time
              description: Batas mutlak sesi (12 jam); sesi juga berakhir setelah 30 menit tidak aktif.
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        database:
          type: string
          enum: [ok, unavailable]
    PublicSummaryEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PublicSummary"
    PublicSummary:
      type: object
      additionalProperties: false
      description: Tanpa database hanya totalGroups, manualUpdate, dan updatedAt (nol). Dengan database, angka dihitung dari tabel publik tahun ajaran aktif.
      required: [totalGroups, manualUpdate, updatedAt]
      properties:
        totalGroups:
          type: integer
          minimum: 0
        none:
          type: integer
          minimum: 0
          description: Belum Mengumpulkan
        partial:
          type: integer
          minimum: 0
          description: Terkumpul Sebagian
        full:
          type: integer
          minimum: 0
          description: Berkas Digital Lengkap
        complete:
          type: integer
          minimum: 0
          description: Tuntas
        manualUpdate:
          type: boolean
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Waktu perubahan kelompok terakhir; null bila belum ada kelompok.
    PublicProgress:
      type: object
      additionalProperties: false
      required: [year, classes, groups]
      properties:
        year:
          type: string
          description: Label tahun ajaran aktif, mis. 2026/2027; kosong bila tidak ada.
        classes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, name]
            properties:
              code:
                type: string
              name:
                type: string
        groups:
          type: array
          items:
            $ref: "#/components/schemas/PublicGroup"
    PublicGroup:
      type: object
      additionalProperties: false
      description: Tidak pernah memuat email, ID, catatan, atau temuan.
      required: [name, classCode, topic, submission, review, notebook, complete, updatedAt]
      properties:
        name:
          type: string
        classCode:
          type: string
        topic:
          type: object
          additionalProperties: false
          required: [code, title]
          properties:
            code:
              type: string
            title:
              type: string
        submission:
          type: string
          enum: [BELUM, SEBAGIAN, LENGKAP]
        review:
          type: string
          enum: [BELUM_DICEK, DIPERIKSA, PERLU_REVISI, REVISI_DITERIMA, DISETUJUI]
        notebook:
          type: string
          enum: [BELUM_DITERIMA, SUDAH_DITERIMA]
        complete:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    SubmissionRound:
      type: object
      additionalProperties: false
      description: Catatan guru; tidak pernah tampil di publik.
      required: [id, groupId, roundNumber, receivedAt, senderEmail, subject, ppt, pdf, pptFilename, pdfFilename, note, createdAt, updatedAt]
      properties:
        id: {type: integer, format: int64}
        groupId: {type: integer, format: int64}
        roundNumber: {type: integer, minimum: 0}
        receivedAt: {type: string, format: date-time}
        senderEmail: {type: string, nullable: true}
        subject: {type: string, maxLength: 300}
        ppt: {type: boolean}
        pdf: {type: boolean}
        pptFilename: {type: string, maxLength: 200}
        pdfFilename: {type: string, maxLength: 200}
        note: {type: string, maxLength: 2000}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SubmissionRoundWrite:
      type: object
      additionalProperties: false
      required: [receivedAt]
      description: Minimal salah satu ppt/pdf true; nama berkas hanya untuk jenis yang dicentang; receivedAt maks 5 menit di masa depan.
      properties:
        roundNumber: {type: integer, minimum: 0, description: Wajib pada POST; diabaikan pada PATCH.}
        receivedAt: {type: string, format: date-time}
        senderEmail: {type: string}
        subject: {type: string, maxLength: 300}
        ppt: {type: boolean}
        pdf: {type: boolean}
        pptFilename: {type: string, maxLength: 200}
        pdfFilename: {type: string, maxLength: 200}
        note: {type: string, maxLength: 2000}
        updatedAt: {type: string, format: date-time, description: Wajib pada PATCH.}
    GroupNotebook:
      type: object
      additionalProperties: false
      required: [received, receivedAt, note, updatedAt]
      properties:
        received: {type: boolean}
        receivedAt: {type: string, format: date-time, nullable: true}
        note: {type: string, maxLength: 1000}
        updatedAt: {type: string, format: date-time, nullable: true}
    AcademicYear:
      type: object
      additionalProperties: false
      required: [id, label, active, createdAt, updatedAt]
      properties:
