openapi: 3.0.3
info:
  title: Informatika Monitoring API
  version: 0.3.0
  description: Kontrak API yang saat ini diimplementasikan oleh backend Go, termasuk autentikasi admin. Endpoint admin hanya aktif bila database dikonfigurasi.
servers:
  - url: /
    description: Same-origin runtime
paths:
  /healthz:
    get:
      summary: Periksa liveness proses
      operationId: getHealth
      responses:
        "200":
          description: Proses HTTP berjalan.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
  /readyz:
    get:
      summary: Periksa kesiapan database
      operationId: getReadiness
      responses:
        "200":
          description: Database siap digunakan.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                status: ok
                database: ok
        "503":
          description: Database belum dikonfigurasi atau tidak tersedia.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                status: unavailable
                database: unavailable
  /api/v1/public/summary:
    get:
      summary: Ambil ringkasan monitoring publik
      operationId: getPublicSummary
      responses:
        "200":
          description: Ringkasan publik berhasil dibaca.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSummaryEnvelope"
              example:
                data:
                  totalGroups: 0
                  manualUpdate: true
                  updatedAt: null
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/auth/login:
    post:
      summary: Masuk sebagai admin
      description: >
        Membuat sesi dan men-set cookie HttpOnly SameSite=Strict (bernama `admin_session`,
        atau `__Host-admin_session` dengan atribut Secure di HTTPS). Cookie berlaku
        selama sesi browser; server menolak sesi yang tidak aktif 30 menit atau lebih dari 12 jam.
        Header Origin, bila ada, wajib sama dengan host. Kegagalan login tidak
        membedakan nama pengguna yang salah dari kata sandi yang salah.
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Berhasil masuk.
          headers:
            Set-Cookie:
              description: Cookie sesi admin.
              schema:
                type: string
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: Nama pengguna atau kata sandi salah (INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Origin tidak diizinkan (FORBIDDEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Badan permintaan lebih dari 4 KiB (PAYLOAD_TOO_LARGE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Content-Type bukan application/json (UNSUPPORTED_MEDIA_TYPE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Terlalu banyak percobaan (RATE_LIMITED).
          headers:
            Retry-After:
              description: Detik sampai boleh mencoba lagi.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Kapasitas hash sandi penuh (SERVICE_BUSY).
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/admin/auth/logout:
    post:
      summary: Keluar dari sesi admin
      description: >
        Idempoten. Bila sesi valid, wajib menyertakan header X-CSRF-Token yang
        sama dengan token dari login atau /me, dan Origin yang sama dengan host.
      operationId: adminLogout
      parameters:
        - name: X-CSRF-Token
          in: header
          required: false
          schema:
            type: string
      responses:
        "204":
          description: Sesi dihapus dan cookie dibersihkan.
        "403":
          description: CSRF token atau Origin tidak valid (FORBIDDEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/admin/auth/me:
    get:
      summary: Ambil identitas sesi admin
      operationId: adminMe
      responses:
        "200":
          description: Sesi valid.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401":
          description: Belum masuk atau sesi berakhir (UNAUTHENTICATED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/public/announcements:
    get:
      summary: Daftar pengumuman terbit
      description: Hanya status published. Yang disematkan lebih dulu, lalu terbaru.
      operationId: listPublicAnnouncements
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Satu halaman pengumuman.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicAnnouncement"
                  meta:
                    $ref: "#/components/schemas/PageMeta"
        "400":
          $ref: "#/components/responses/BadQuery"
  /api/v1/public/announcements/{id}:
    get:
      summary: Satu pengumuman terbit
      operationId: getPublicAnnouncement
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Pengumuman ditemukan.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PublicAnnouncement"
        "404":
          description: Tidak ada, belum terbit, atau sudah dihapus (draf tidak pernah dibedakan dari tidak ada).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/public/topics:
    get:
      summary: Tujuh topik proyek K1-K7
      operationId: listPublicTopics
      responses:
        "200":
          description: Semua topik, urut sortOrder.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Topic"
  /api/v1/public/materials:
    get:
      summary: Daftar materi terbit
      operationId: listPublicMaterials
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: topic
          in: query
          required: false
          description: Kode topik, mis. K1. Kosong berarti semua topik termasuk Umum.
          schema:
            type: string
      responses:
        "200":
          description: Satu halaman materi.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicMaterial"
                  meta:
                    $ref: "#/components/schemas/PageMeta"
        "400":
          $ref: "#/components/responses/BadQuery"
  /api/v1/public/materials/{id}:
    get:
      summary: Satu materi terbit
      operationId: getPublicMaterial
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Materi ditemukan.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PublicMaterial"
        "404":
          description: Tidak ada, belum terbit, atau sudah dihapus.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/admin/announcements:
    get:
      summary: Semua pengumuman (draf dan terbit)
      operationId: listAdminAnnouncements
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/AdminList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      summary: Buat pengumuman
      operationId: createAdminAnnouncement
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementWrite"
      responses:
        "201":
          $ref: "#/components/responses/AdminItemCreated"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/v1/admin/announcements/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Satu pengumuman (draf atau terbit)
      operationId: getAdminAnnouncement
      responses:
        "200":
          $ref: "#/components/responses/AdminItemOK"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Ubah pengumuman
      description: Kirim ulang semua isian beserta updatedAt yang terakhir dibaca. updatedAt lama ditolak 409.
      operationId: updateAdminAnnouncement
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AnnouncementWrite"
                - $ref: "#/components/schemas/UpdatedAtGuard"
      responses:
        "200":
          $ref: "#/components/responses/AdminItemOK"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      summary: Hapus permanen pengumuman
      operationId: deleteAdminAnnouncement
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204":
          description: Dihapus; judul dan id tercatat di audit_log.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/materials:
    get:
      summary: Semua materi (draf dan terbit)
      operationId: listAdminMaterials
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/AdminList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      summary: Buat materi
      operationId: createAdminMaterial
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialWrite"
      responses:
        "201":
          $ref: "#/components/responses/AdminItemCreated"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/v1/admin/materials/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Satu materi (draf atau terbit)
      operationId: getAdminMaterial
      responses:
        "200":
          $ref: "#/components/responses/AdminItemOK"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Ubah materi
      operationId: updateAdminMaterial
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/MaterialWrite"
                - $ref: "#/components/schemas/UpdatedAtGuard"
      responses:
        "200":
          $ref: "#/components/responses/AdminItemOK"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      summary: Hapus permanen materi
      operationId: deleteAdminMaterial
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204":
          description: Dihapus; judul dan id tercatat di audit_log.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token dari login atau /me. Origin juga wajib sama dengan host.
      schema:
        type: string
  headers:
    RequestID:
      description: ID korelasi unik untuk request.
      schema:
        type: string
  responses:
    BadQuery:
      description: Parameter page/limit tidak valid (VALIDATION_ERROR).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthenticated:
      description: Belum masuk atau sesi berakhir (UNAUTHENTICATED).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: CSRF token atau Origin tidak valid (FORBIDDEN).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: updatedAt tidak sama dengan yang tersimpan; data sudah diubah di tempat lain (CONFLICT).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Invalid:
      description: Judul, isi, status, topik, atau urutan tidak memenuhi aturan (VALIDATION_ERROR).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AdminList:
      description: Satu halaman item admin.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data, meta]
            properties:
              data:
                type: array
                items:
                  $ref: "#/components/schemas/AdminItem"
              meta:
                $ref: "#/components/schemas/PageMeta"
    AdminItemOK:
      description: Item admin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminItemEnvelope"
    AdminItemCreated:
      description: Item dibuat.
      headers:
        Location:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminItemEnvelope"
    InvalidRequest:
      description: Permintaan tidak valid (INVALID_REQUEST).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Endpoint tidak ditemukan.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: NOT_FOUND
              message: Endpoint tidak ditemukan.
  schemas:
    PageMeta:
      type: object
      additionalProperties: false
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    PublicAnnouncement:
      type: object
      additionalProperties: false
      required: [id, title, body, publishedAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        body:
          type: string
          description: Teks biasa; klien tidak boleh merendernya sebagai HTML.
        publishedAt:
          type: string
          format: date-time
    Topic:
      type: object
      additionalProperties: false
      required: [id, code, title, sortOrder]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
          pattern: "^K[1-9]$"
        title:
          type: string
        sortOrder:
          type: integer
    PublicMaterial:
      type: object
      additionalProperties: false
      required: [id, title, description, publishedAt, topic]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
          description: Teks biasa.
        publishedAt:
          type: string
          format: date-time
        topic:
          nullable: true
          description: null berarti Umum (tanpa topik).
          type: object
          additionalProperties: false
          required: [id, code, title]
          properties:
            id:
              type: integer
              format: int64
            code:
              type: string
            title:
              type: string
    AnnouncementWrite:
      type: object
      required: [title, status]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
          description: Dipangkas spasinya; 1-160 karakter Unicode.
        body:
          type: string
          maxLength: 10000
          default: ""
        status:
          type: string
          enum: [draft, published]
        pinned:
          type: boolean
          default: false
    MaterialWrite:
      type: object
      required: [title, status]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 20000
          default: ""
        status:
          type: string
          enum: [draft, published]
        topicId:
          type: integer
          format: int64
          nullable: true
          description: null berarti Umum.
        sortOrder:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
    UpdatedAtGuard:
      type: object
      required: [updatedAt]
      properties:
        updatedAt:
          type: string
          format: date-time
          description: Nilai updatedAt persis seperti diterima dari server.
    AdminItem:
      type: object
      description: >
        Field bernilai nol (body/description kosong, pinned false, sortOrder 0,
        topicId kosong) dihilangkan dari respons; klien wajib mengisi nilai bawaannya.
      required: [id, title, status, publishedAt, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        topicId:
          type: integer
          format: int64
        title:
          type: string
        body:
          type: string
          description: Hanya untuk pengumuman.
        description:
          type: string
          description: Hanya untuk materi.
        status:
          type: string
          enum: [draft, published]
        pinned:
          type: boolean
        sortOrder:
          type: integer
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: Diisi saat pertama terbit dan tidak berubah sesudahnya.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AdminItemEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AdminItem"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 128
          format: password
    AuthEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [username, csrfToken, expiresAt]
          properties:
            username:
              type: string
            csrfToken:
              type: string
              description: Kirim sebagai header X-CSRF-Token pada setiap permintaan POST/PUT/PATCH/DELETE admin.
            expiresAt:
              type: string
              format: date-time
              description: Batas mutlak sesi (12 jam); sesi juga berakhir setelah 30 menit tidak aktif.
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        database:
          type: string
          enum: [ok, unavailable]
    PublicSummaryEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PublicSummary"
    PublicSummary:
      type: object
      additionalProperties: false
      required: [totalGroups, manualUpdate, updatedAt]
      properties:
        totalGroups:
          type: integer
          minimum: 0
        manualUpdate:
          type: boolean
        updatedAt:
          type: string
          format: date-time
          nullable: true
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
